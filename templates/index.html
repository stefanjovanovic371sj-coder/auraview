<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Universal CGM AGP Parser</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen py-10 px-4 flex flex-col items-center">
    <div class="w-full max-w-4xl">
        <header class="flex justify-between items-center mb-8 bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
            <div>
                <h1 class="text-2xl font-bold text-teal-400">CGM AGP Analizator</h1>
                <p class="text-slate-400 text-sm mt-1">Sistem za obradu i sinhronizaciju medicinskih izveštaja.</p>
            </div>
            <a href="/dashboard" class="bg-teal-600 hover:bg-teal-500 text-white px-4 py-2.5 rounded-xl font-semibold text-sm transition shadow-lg">Lekarski Panel →</a>
        </header>

        <!-- Forma za unos -->
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl mb-8 space-y-5">
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2">Izaberite CGM uređaj / platformu:</label>
                <select id="deviceSelect" class="w-full bg-slate-900 border border-slate-700 text-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:border-teal-500">
                    <option value="accu_check">Accu-Chek / mySugr (SmartGuide Predict)</option>
                    <option value="dexcom">Dexcom (G6 / G7 / ONE)</option>
                    <option value="freestyle_libre">Abbott FreeStyle Libre (1 / 2 / 3)</option>
                    <option value="medtronic">Medtronic (Guardian / Simplera)</option>
                    <option value="medtrum">Medtrum (TouchCare / Nano)</option>
                    <option value="anytime">Anytime CGM</option>
                </select>
            </div>

            <div class="border-2 border-dashed border-slate-700 rounded-xl p-6 text-center hover:border-teal-500 transition">
                <input type="file" id="file" accept=".pdf" class="hidden" onchange="fileSelected(this)">
                <label for="file" class="cursor-pointer flex flex-col items-center">
                    <svg class="w-12 h-12 text-teal-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                    <span id="fileLabel" class="text-base font-medium text-slate-200">Izaberite PDF izveštaj</span>
                </label>
            </div>

            <button onclick="parseFile()" class="w-full bg-teal-600 hover:bg-teal-500 text-white font-bold py-3 rounded-xl transition shadow-lg">
                Parsiraj i Sačuvaj Izveštaj
            </button>
        </div>

        <div id="loader" class="hidden text-center my-10">
            <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-teal-500 border-t-transparent"></div>
            <p class="text-slate-400 mt-3 font-medium">Analiza u toku...</p>
        </div>

        <div id="result" class="space-y-6"></div>

        <div class="mt-8 bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl">
            <h2 class="text-sm font-semibold text-teal-400 uppercase tracking-wider mb-3">Debug JSON</h2>
            <pre id="json" class="bg-slate-900 text-slate-300 p-4 rounded-xl text-xs overflow-x-auto max-h-60">Nema učitanih podataka.</pre>
        </div>
    </div>

<script>
function fileSelected(input) {
    if (input.files && input.files[0]) {
        document.getElementById("fileLabel").textContent = input.files[0].name;
    }
}

async function parseFile() {
    const fileInput = document.getElementById("file");
    const deviceSelect = document.getElementById("deviceSelect");
    
    if (!fileInput.files.length) {
        alert("Molimo izaberite PDF fajl.");
        return;
    }

    const formData = new FormData();
    formData.append("file", fileInput.files[0]);
    formData.append("device", deviceSelect.value);

    document.getElementById("loader").classList.remove("hidden");
    document.getElementById("result").innerHTML = "";
    document.getElementById("json").textContent = "Obrada u toku...";

    try {
        const response = await fetch("/upload", { method: "POST", body: formData });
        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.detail || "Greška pri obradi.");
        }

        renderResult(data.report);
        document.getElementById("json").textContent = JSON.stringify(data, null, 2);
    } catch (error) {
        document.getElementById("result").innerHTML = `
            <div class="bg-rose-900/40 border border-rose-600 text-rose-200 p-4 rounded-xl font-medium">
                ${error.message}
            </div>`;
        document.getElementById("json").textContent = error.message;
    } finally {
        document.getElementById("loader").classList.add("hidden");
    }
}

function renderResult(data) {
    const a = data.actual_components;
    const d = data.derived_metrics;
    
    let html = `
    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl space-y-6">
        <div class="flex justify-between items-center border-b border-slate-700 pb-4">
            <div>
                <h2 class="text-xl font-bold text-teal-300">Rezultat analize</h2>
                <p class="text-slate-400 text-xs mt-1">Period: ${data.reporting_period.start || '?'} → ${data.reporting_period.end || '?'}</p>
            </div>
            <span class="bg-emerald-900/80 text-emerald-300 px-3 py-1 rounded-full text-xs font-bold border border-emerald-700">USPEŠNO</span>
        </div>
        <div class="grid grid-cols-3 gap-4 text-center">
            <div class="bg-slate-900/60 p-4 rounded-xl border border-slate-700/50"><span class="block text-xs font-semibold text-rose-400">TBR</span><span class="text-2xl font-bold">${d.TBR !== null ? d.TBR + '%' : '—'}</span></div>
            <div class="bg-slate-900/60 p-4 rounded-xl border border-slate-700/50"><span class="block text-xs font-semibold text-emerald-400">TIR</span><span class="text-2xl font-bold">${d.TIR !== null ? d.TIR + '%' : '—'}</span></div>
            <div class="bg-slate-900/60 p-4 rounded-xl border border-slate-700/50"><span class="block text-xs font-semibold text-amber-400">TAR</span><span class="text-2xl font-bold">${d.TAR !== null ? d.TAR + '%' : '—'}</span></div>
        </div>
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 text-center">
            <div class="bg-slate-900/40 p-3 rounded-xl"><span class="block text-xs text-slate-400">Glukoza</span><span class="text-base font-bold">${a.AVG_GLUCOSE || '—'} mmol/L</span></div>
            <div class="bg-slate-900/40 p-3 rounded-xl"><span class="block text-xs text-slate-400">GMI</span><span class="text-base font-bold">${a.GMI || '—'}%</span></div>
            <div class="bg-slate-900/40 p-3 rounded-xl"><span class="block text-xs text-slate-400">CV</span><span class="text-base font-bold">${a.CV || '—'}%</span></div>
            <div class="bg-slate-900/40 p-3 rounded-xl"><span class="block text-xs text-slate-400">Aktivno</span><span class="text-base font-bold">${a.ACTIVE_TIME || '—'}%</span></div>
        </div>
    </div>`;
    document.getElementById("result").innerHTML = html;
}
</script>
</body>
</html>
