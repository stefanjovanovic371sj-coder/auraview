<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dr Marko Jovanović — Live Panel</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen py-10 px-4 flex flex-col items-center">
<div class="w-full max-w-4xl">
    <header class="flex justify-between items-center mb-8 bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
        <div>
            <h1 class="text-xl font-bold text-teal-400">Dr Marko Jovanović — Live Panel</h1>
            <p class="text-slate-400 text-sm mt-1">Pregled sačuvanih CGM izveštaja iz baze podataka.</p>
        </div>
        <a href="/" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2.5 rounded-xl font-semibold text-sm transition">← Nazad na Upload</a>
    </header>
    <div id="c" class="space-y-4">
        <div class="bg-slate-800 p-6 rounded-2xl text-center text-slate-400">Učitavanje izveštaja iz baze...</div>
    </div>
</div>
<script>
async function loadReports() {
    try {
        const res = await fetch('/api/reports');
        const data = await res.json();
        if(!data.length) {
            document.getElementById('c').innerHTML = `<div class="bg-slate-800 border border-slate-700 p-8 rounded-2xl text-center text-slate-400">Nema sačuvanih izveštaja u bazi.</div>`;
            return;
        }
        document.getElementById('c').innerHTML = data.map(r => `
            <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl shadow-xl space-y-4">
                <div class="flex justify-between items-center border-b border-slate-700 pb-3">
                    <span class="font-bold text-slate-200">Pacijent: ${r.patient_id}</span>
                    <span class="text-xs bg-teal-900/60 text-teal-300 border border-teal-700 px-3 py-1 rounded-full font-semibold">${r.device_name || 'CGM Report'}</span>
                </div>
                <div class="grid grid-cols-2 sm:grid-cols-6 gap-3 text-center">
                    <div class="bg-slate-900/50 p-3 rounded-xl border border-slate-700/40"><span class="block text-[10px] text-slate-400 uppercase font-semibold">TIR</span><span class="text-lg font-bold text-emerald-400">${r.tir !== null ? r.tir + '%' : '-'}</span></div>
                    <div class="bg-slate-900/50 p-3 rounded-xl border border-slate-700/40"><span class="block text-[10px] text-slate-400 uppercase font-semibold">TBR</span><span class="text-lg font-bold text-rose-400">${r.tbr !== null ? r.tbr + '%' : '-'}</span></div>
                    <div class="bg-slate-900/50 p-3 rounded-xl border border-slate-700/40"><span class="block text-[10px] text-slate-400 uppercase font-semibold">TAR</span><span class="text-lg font-bold text-amber-400">${r.tar !== null ? r.tar + '%' : '-'}</span></div>
                    <div class="bg-slate-900/50 p-3 rounded-xl border border-slate-700/40"><span class="block text-[10px] text-slate-400 uppercase font-semibold">GMI</span><span class="text-lg font-bold text-slate-200">${r.gmi_percent !== null ? r.gmi_percent + '%' : '-'}</span></div>
                    <div class="bg-slate-900/50 p-3 rounded-xl border border-slate-700/40"><span class="block text-[10px] text-slate-400 uppercase font-semibold">CV</span><span class="text-lg font-bold text-slate-200">${r.cv !== null ? r.cv + '%' : '-'}</span></div>
                    <div class="bg-slate-900/50 p-3 rounded-xl border border-slate-700/40"><span class="block text-[10px] text-slate-400 uppercase font-semibold">Aktivno</span><span class="text-lg font-bold text-slate-200">${r.active_time || '-'}</span></div>
                </div>
            </div>
        `).join('');
    } catch(err) {
        document.getElementById('c').innerHTML = `<div class="bg-rose-900/50 border border-rose-700 p-6 rounded-2xl text-center text-rose-200">Greška pri učitavanju sa servera.</div>`;
    }
}
loadReports();
</script>
</body>
</html>
